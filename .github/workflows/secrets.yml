name: secrets

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Download a pinned gitleaks release and verify its SHA-256 checksum
      # before running it. No third-party gitleaks action is used.
      - name: Download gitleaks
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks

      - name: Scan git history
        run: ./gitleaks git --log-opts=--all --no-banner

      - name: Scan working tree
        run: ./gitleaks dir --no-banner .
