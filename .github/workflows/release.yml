name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/dynamoat
            ~/go/pkg/mod
          key: go-${{ hashFiles('scripts/go.sh', 'server/go.sum') }}
      - run: scripts/test.sh

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/dynamoat
            ~/go/pkg/mod
          key: go-${{ hashFiles('scripts/go.sh', 'server/go.sum') }}

      - name: Compute release metadata
        id: meta
        run: |
          set -eu
          version="$GITHUB_REF_NAME"
          commit="$(git rev-list -n 1 "refs/tags/$version")"
          prerelease=false
          case "$version" in
            *-*) prerelease=true ;;
          esac

          image="ghcr.io/${{ github.repository_owner }}/dynamoat"
          tags="$image:$version"
          if [ "$prerelease" = false ]; then
            tags="$(printf '%s\n%s' "$tags" "$image:latest")"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$tags" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Release notes
        run: |
          set -eu
          version="${{ steps.meta.outputs.version }}"
          body=""
          if [ -f CHANGELOG.md ]; then
            # Take the section whose heading names this version (with or
            # without the leading "v"), through the next same-or-higher level.
            body="$(awk -v v="$version" -v nv="${version#v}" '
              /^#{1,6}[[:space:]]/ {
                level = match($0, /[^#]/) - 1
                if (started && level <= start_level) exit
                if (!started && (index($0, v) > 0 || (nv != "" && index($0, nv) > 0))) {
                  started = 1
                  start_level = level
                }
                next
              }
              started { print }
            ' CHANGELOG.md)"
          fi
          if [ -z "$body" ]; then
            body="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$version/CHANGELOG.md) for the changes in this release."
          fi
          printf '%s\n' "$body" > .release-notes.md

      - name: Build release archives
        run: |
          set -eu
          version="${{ steps.meta.outputs.version }}"
          commit="${{ steps.meta.outputs.commit }}"
          mkdir -p dist
          for target in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64"; do
            set -- $target
            os=$1
            arch=$2
            dir="dynamoat_${version}_${os}_${arch}"
            mkdir -p "dist/$dir"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" scripts/go.sh -C server build \
              -trimpath -ldflags "-s -w -X main.version=$version -X main.commit=$commit" \
              -o "../dist/$dir/dynamoat" ./cmd/dynamoat
            for f in LICENSE NOTICE README.md; do
              if [ -f "$f" ]; then cp "$f" "dist/$dir/$f"; fi
            done
            tar -C dist -czf "dist/$dir.tar.gz" "$dir"
          done
          (cd dist && sha256sum dynamoat_*.tar.gz > SHA256SUMS)

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${{ steps.meta.outputs.version }}"
          prerelease="${{ steps.meta.outputs.prerelease }}"

          prerelease_args=
          if [ "$prerelease" = true ]; then
            prerelease_args=--prerelease
          fi

          gh release create "$version" \
            dist/dynamoat_${version}_*.tar.gz \
            dist/SHA256SUMS \
            --title "$version" \
            --notes-file .release-notes.md \
            $prerelease_args

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
          tags: ${{ steps.meta.outputs.tags }}
