{{- if and (eq .Values.auth.mode "sigv4") (not .Values.auth.existingSecret) (not (empty .Values.auth.keys)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dynamoat.keysSecretName" . }}
  labels:
    {{- include "dynamoat.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $id, $secret := .Values.auth.keys }}
  {{ $id | quote }}: {{ $secret | quote }}
  {{- end }}
{{- end }}
