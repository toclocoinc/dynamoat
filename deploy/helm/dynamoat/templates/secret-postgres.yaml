{{- if and (not .Values.postgres.existingSecret) .Values.postgres.connectionString }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dynamoat.postgresSecretName" . }}
  labels:
    {{- include "dynamoat.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgres.secretKey | quote }}: {{ .Values.postgres.connectionString | quote }}
{{- end }}
